<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel devtools</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --ink: #1d2433; --muted: #6b7385; --line: #dfe3ea; --accent: #2f6fde; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171d; --panel: #1b1f27; --ink: #e5e8ef; --muted: #9098aa; --line: #2b313d; --accent: #6ea0ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 12px 0 0; }
  input, select, textarea, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
  button { cursor: pointer; background: var(--accent); color: #fff; border: 0; }
  #url { width: 280px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: calc(100vh - 46px); }
  .view { overflow: auto; padding: 12px; }
  .stage { position: relative; display: inline-block; box-shadow: 0 1px 6px rgba(0,0,0,.2); }
  .stage img { display: block; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  #status { color: var(--muted); margin-left: auto; }
  aside { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: 1fr 1fr; min-height: 0; }
  #tree { overflow: auto; font: 12px/1.6 ui-monospace, monospace; border-bottom: 1px solid var(--line); padding: 4px 0; }
  .node { white-space: nowrap; cursor: default; }
  .node:hover { background: rgba(47,111,222,.1); }
  .node.sel { background: rgba(47,111,222,.25); }
  .tw { display: inline-block; width: 14px; color: var(--muted); cursor: pointer; }
  .bottom { display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { background: none; color: var(--muted); border-radius: 0; padding: 6px 10px; }
  .tabs button.on { color: var(--ink); box-shadow: inset 0 -2px var(--accent); }
  .pane { display: none; overflow: auto; padding: 8px; flex: 1; }
  .pane.on { display: block; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 2px 6px; border-bottom: 1px solid var(--line); font-weight: normal; vertical-align: top; word-break: break-all; }
  th { color: var(--muted); width: 1%; white-space: nowrap; }
  .muted { color: var(--muted); }
  .log { font-family: ui-monospace, monospace; border-bottom: 1px solid var(--line); padding: 2px 0; }
  .err { font-family: ui-monospace, monospace; color: #d14343; border-bottom: 1px solid var(--line); padding: 2px 0; }
  .bm { margin-bottom: 8px; font-size: 11px; text-align: center; }
  .bm div { position: relative; padding: 16px 22px; margin: 2px auto; }
  .bm .m { background: rgba(246,178,107,.45); } .bm .bo { background: rgba(255,229,153,.7); }
  .bm .pa { background: rgba(147,196,125,.6); } .bm .co { background: rgba(111,168,220,.6); padding: 6px; }
  .bm span { position: absolute; } .bm .t { top: 1px; left: 50%; } .bm .b { bottom: 1px; left: 50%; }
  .bm .l { left: 4px; top: 50%; } .bm .r { right: 4px; top: 50%; }
  .bar { display: grid; grid-template-columns: 90px 1fr 70px; align-items: center; gap: 6px; margin: 4px 0; }
  .track { position: relative; height: 10px; background: var(--bg); border-radius: 3px; }
  .fill { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
  .ms { text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } aside { grid-template-rows: 300px 300px; } }
</style>
</head>
<body>
<header>
  <h1>Kestrel devtools</h1>
  <select id="page"></select><button id="go-page">Render page</button>
  <input id="url" placeholder="http://localhost:8091/pages/…"><button id="go-url">Render URL</button>
  <span id="status">pick a page</span>
</header>
<main>
  <section class="view">
    <div class="stage"><img id="shot" alt="the rendered page" width="800" height="600"><canvas id="overlay"></canvas></div>
    <details style="margin-top:12px"><summary>Render your own HTML</summary>
      <textarea id="html" rows="8" style="width:100%">&lt;h1 style="color:teal"&gt;Hello&lt;/h1&gt;&lt;p&gt;Edit me.&lt;/p&gt;</textarea>
      <button id="go-html">Render HTML</button></details>
  </section>
  <aside>
    <div id="tree"></div>
    <div class="bottom">
      <div class="tabs"><button class="on" data-pane="computed">Computed</button><button data-pane="console">Console</button><button data-pane="network">Network</button><button data-pane="timings">Timings</button></div>
      <div id="computed" class="pane on"></div><div id="console" class="pane"></div><div id="network" class="pane"></div><div id="timings" class="pane"></div>
    </div>
  </aside>
</main>
<script type="module" src="dist/main.js"></script>
</body>
</html>
